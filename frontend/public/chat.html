<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lawyersathi Chat Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="chat.css">
  <style>
    .language-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .language-selector button { min-height: 38px; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; color: #d9e7f2; background: transparent; font: 700 .74rem inherit; cursor: pointer; }
    .language-selector button.active { color: #102a43; background: #e6c77d; border-color: #e6c77d; }
    .workspace { height: 100vh; overflow: hidden; grid-template-rows: auto minmax(0, 1fr) auto; }
    .thread { min-height: 0; }
    .composer { position: relative; z-index: 2; }
    .composer textarea:disabled, .composer button:disabled { cursor: not-allowed; opacity: .55; }
    @media (max-width: 850px) { .workspace { height: auto; min-height: calc(100vh - 210px); overflow: visible; } }
    body { background:#000; color:#ececec; }
    .chat-layout { background:#000; grid-template-columns:260px 1fr; }
    .sidebar { background:#0d0d0d; border-right:1px solid #272727; }
    .workspace { width:100%; max-width:1180px; background:#000; padding:18px 30px; }
    .workspace-header { display:none; }
    .thread { min-height:0; padding:30px 8%; border:0; border-radius:0; background:#000; box-shadow:none; }
    .message { max-width:min(76%,760px); color:#f2f2f2; border:0; border-radius:25px; background:#242424; font-size:.94rem; }
    .message.assistant { align-self:flex-start; background:transparent; padding:12px 4px; }
    .message.system { color:#bdbdbd; background:transparent; border:0; }
    .message.user { align-self:flex-end; background:#2c2c2c; border-radius:25px; }
    .citations { border-color:#3b3b3b; color:#b8b8b8; }.citations strong{color:#e5e5e5;}
    .composer { width:min(840px,100%); margin:auto auto 30px; grid-template-columns:1fr auto auto; border:1px solid #424242; border-radius:28px; background:#242424; box-shadow:none; }
    .composer textarea { min-height:54px; color:#f4f4f4; background:transparent; }.composer textarea::placeholder{color:#9d9d9d}
    .composer button { width:42px; min-height:42px; padding:0; border-radius:50%; color:#111; background:#f5f5f5; font-size:0; box-shadow:none; }.composer button:after{content:'↑';font-size:1.2rem;font-weight:800}
    .composer .draft-mode { width:auto; min-height:36px; padding:0 13px; border:1px solid #686868; border-radius:18px; color:#efefef; background:#303030; font-size:.75rem; box-shadow:none; }
    .composer .draft-mode:after { content:none; }
    .composer .draft-mode.active { color:#171717; background:#e6c77d; border-color:#e6c77d; }
    .composer:before { content:'Lawyersathi can make mistakes. Check important legal information.'; position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); width:max-content; max-width:90vw; color:#858585; font-size:.67rem; }
    .language-selector button.active { color:#111; background:#fff; }
    @media (max-width:850px){.chat-layout{grid-template-columns:1fr}.workspace{padding:12px}.thread{padding:20px 5%}.sidebar{display:none}.composer:before{display:none}}
  </style>
</head>
<body>
  <div class="chat-layout">
    <aside class="sidebar">
      <a class="logo" href="/">
        <span>L</span>
        <strong>Lawyersathi</strong>
      </a>

      <p class="workspace-label">LAWYERSATHI / LEGAL AI</p>
      <a class="prompt-chip" href="/chat.html?draft=1" style="text-decoration:none">जाहेरी दरखास्त तयार गर्नुहोस्</a>
      <section class="mode-panel">
        <h2 data-i18n="modeTitle">Consultation Mode</h2>
        <label for="audience" data-i18n="audienceLabel">Audience</label>
        <select id="audience">
          <option value="citizen" data-i18n="citizen">Citizen</option>
          <option value="lawfirm" data-i18n="lawFirm">Law Firm</option>
          <option value="government" data-i18n="government">Government</option>
        </select>
        <div class="language-selector" aria-label="Response language"><button type="button" data-lang="en">English</button><button type="button" data-lang="ne">नेपाली</button></div>
      </section>

      <section class="tips">
        <h3 data-i18n="tipsTitle">Suggested prompts</h3>
        <button class="prompt-chip" data-prompt="What is the right process for reporting social violence and protecting evidence?" data-i18n="promptOne">Social violence reporting process</button>
        <button class="prompt-chip" data-prompt="How should a law firm verify a legal complaint draft before filing?" data-i18n="promptTwo">Law firm review checklist</button>
        <button class="prompt-chip" data-prompt="What should government teams check before issuing legal action notice?" data-i18n="promptThree">Government legal action checklist</button>
      </section>
    </aside>

    <main class="workspace">
      <header class="workspace-header">
        <div>
          <p class="status-pill"><span></span><span data-i18n="statusReady">Workspace ready</span></p>
          <h1 data-i18n="chatTitle">Legal Assistant Workspace</h1>
          <p data-i18n="chatSub">Ask a legal question and receive source-grounded responses.</p>
          <p class="usage-status" id="usageStatus"></p>
        </div>
        <a class="back-link" href="/" data-i18n="backHome">Back to Home</a>
      </header>

      <section class="thread" id="thread">
        <article class="message system">
          <p data-i18n="systemMsg">Welcome. Ask your legal question to begin.</p>
        </article>
      </section>

      <section class="composer">
        <label class="sr-only" for="question">Question</label>
        <textarea id="question" rows="3" placeholder="Type your legal question..." data-i18n-placeholder="placeholder"></textarea>
        <button id="draftMode" class="draft-mode" type="button" aria-pressed="false">Draft</button>
        <button id="send" type="button" data-i18n="sendBtn">Ask Assistant</button>
      </section>
    </main>
  </div>

  <script src="chat.js"></script>
</body>
</html>
